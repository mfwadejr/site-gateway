services:
  web-server:
    image: ghcr.io/mfwadejr/web-server:latest
    container_name: web-server
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_PORT: 8080
      SITE_PORT_MIN: 9000
      SITE_PORT_MAX: 9099
      DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "8080:8080"
      - "9000-9099:9000-9099"
    volumes:
      - ${WEB_SERVER_DATA:-/DATA/AppData/web-server}:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
